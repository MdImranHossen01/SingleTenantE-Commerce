name: Deploy SingleTenant Master to Vercel (Zero Build Cost)

on:
  workflow_dispatch:
    inputs:
      target_client:
        description: 'কোন ক্লায়েন্ট ডিপ্লয় করতে চান? (all = সবাই)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - janopriyo-shop

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.set-matrix.outputs.clients }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target_client }}" != "all" ]; then
            echo 'clients=["${{ inputs.target_client }}"]' >> $GITHUB_OUTPUT
          else
            echo 'clients=["janopriyo-shop"]' >> $GITHUB_OUTPUT
          fi

  deploy-vercel-production:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJson(needs.prepare.outputs.clients) }}
    environment: ${{ matrix.client }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check Client Configuration
        id: check
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping ${{ matrix.client }} — VERCEL_PROJECT_ID not set in this Environment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        if: steps.check.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment
        if: steps.check.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Sync ENV_FILE to Vercel Production & Build Env (Optional)
        if: steps.check.outputs.configured == 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret not set, using Vercel env only."
            exit 0
          fi

          node << 'EOF'
          const fs = require("fs");

          const token = process.env.VERCEL_TOKEN;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const orgId = process.env.VERCEL_ORG_ID;
          const envFile = process.env.ENV_FILE || "";

          const parseEnv = (src) => {
            const map = new Map();
            for (const rawLine of src.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;
              const match = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/);
              if (!match) continue;
              const key = match[1];
              let val = match[2].trim();
              if (
                (val.startsWith('"') && val.endsWith('"')) ||
                (val.startsWith("'") && val.endsWith("'"))
              ) {
                val = val.slice(1, -1);
              }
              map.set(key, val);
            }
            return map;
          };

          const rawLinesMap = new Map();
          for (const rawLine of envFile.split(/\r?\n/)) {
            const match = rawLine.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/);
            if (match) rawLinesMap.set(match[1], match[2]);
          }

          // 1. Merge ENV_FILE into .vercel/.env.production.local for GitHub Runner build
          const envPath = ".vercel/.env.production.local";
          const existing = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
          const merged = new Map();
          for (const line of existing.split(/\r?\n/)) {
            const m = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/);
            if (m) merged.set(m[1], m[2]);
          }
          for (const [k, v] of rawLinesMap) {
            merged.set(k, v);
          }
          fs.mkdirSync(".vercel", { recursive: true });
          fs.writeFileSync(
            envPath,
            [...merged.entries()].map(([k, v]) => `${k}=${v}`).join("\n") + "\n"
          );
          console.log(`Merged ${rawLinesMap.size} ENV_FILE vars into ${envPath}`);

          // 2. Sync ENV_FILE to Vercel Production Environment Variables (free API call, no build triggered)
          const skipKeys = new Set([
            "VERCEL",
            "VERCEL_ENV",
            "VERCEL_URL",
            "VERCEL_REGION",
            "VERCEL_ORG_ID",
          ]);
          const parsed = parseEnv(envFile);
          const payload = [];
          for (const [key, value] of parsed) {
            if (!value || skipKeys.has(key)) continue;
            if (value.startsWith("PASTE_")) continue;
            payload.push({
              key,
              value,
              type: "encrypted",
              target: ["production"],
            });
          }

          (async () => {
            if (!token || !projectId || payload.length === 0) return;
            const teamQuery = orgId ? `&teamId=${encodeURIComponent(orgId)}` : "";
            const url = `https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env?upsert=true${teamQuery}`;
            const res = await fetch(url, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            if (res.ok) {
              console.log(`Synced ${payload.length} Production env vars to Vercel.`);
              return;
            }
            let synced = 0;
            let skipped = 0;
            for (const item of payload) {
              const r = await fetch(url, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(item),
              });
              if (r.ok) synced++;
              else skipped++;
            }
            console.log(`Synced ${synced} Production env vars to Vercel (${skipped} unchanged/sensitive).`);
          })().catch((err) => {
            console.warn("Vercel env sync warning:", err.message);
          });
          EOF

      - name: Build Project on GitHub Runner ($0 Vercel Build Cost)
        if: steps.check.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        if: steps.check.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Auto-Purge Cloudflare Cache
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # Wait 3s for Vercel production alias propagation before purging edge cache
          sleep 3

          ZONE_ID="$(echo "${CLOUDFLARE_ZONE_ID}" | tr -d '[:space:]"'\''')"
          API_TOKEN="$(echo "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]"'\''')"

          # Fallback: extract from ENV_FILE if not set as separate secret
          if [ -z "$ZONE_ID" ] && [ -n "$ENV_FILE" ]; then
            ZONE_ID="$(echo "$ENV_FILE" | grep -E '^\s*CLOUDFLARE_ZONE_ID\s*=' | tail -n 1 | cut -d '=' -f2- | tr -d '[:space:]"'\''')"
          fi
          if [ -z "$API_TOKEN" ] && [ -n "$ENV_FILE" ]; then
            API_TOKEN="$(echo "$ENV_FILE" | grep -E '^\s*CLOUDFLARE_API_TOKEN\s*=' | tail -n 1 | cut -d '=' -f2- | tr -d '[:space:]"'\''')"
          fi

          if [ -n "$ZONE_ID" ] && [ -n "$API_TOKEN" ]; then
            echo "Purging Cloudflare edge cache for zone: ${ZONE_ID:0:6}..."
            RESP=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Cloudflare response: $RESP"
            if echo "$RESP" | grep -q '"success":true'; then
              echo "✅ Cloudflare cache purged successfully!"
            else
              echo "⚠️ Cloudflare cache purge returned an error. Check CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN permissions."
              exit 1
            fi
          else
            echo "Cloudflare secrets not set, skipping purge."
          fi
